<!doctype html>
<html lang="nl"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" /><title>Kies een pakket</title>
<link rel="icon" href="assets/wiswizlogo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root { --mathyellow:#ecc862; --mathorange:#db9a1f; --info:#3e8ed0; --info-dark:#1f6fb0;
    --achtergrond:#f0f9ff; --gray-950:#030712; --gray-700:#374151; --gray-500:#6b7280;
    --gray-300:#d1d5db; --gray-100:#f3f4f6; }
  * { box-sizing:border-box; } html,body { margin:0; padding:0; }
  body { font-family:"Ubuntu",system-ui,sans-serif; background:var(--achtergrond); color:var(--gray-950);
    -webkit-font-smoothing:antialiased; line-height:1.5; min-height:100dvh; }
  a { color:inherit; text-decoration:none; } img { max-width:100%; height:auto; }
  main { max-width:480px; margin:0 auto; padding:28px 16px 64px; }
  h1 { margin:0; text-align:center; font-size:24px; font-weight:800; line-height:1.25; }
  .mock-banner { position:sticky; top:0; z-index:60; background:#111827; color:#fff; text-align:center;
    font-size:11px; padding:5px 10px; letter-spacing:.02em; }
  .mock-banner b { color:var(--mathyellow); }
  .btn-primary { display:block; width:100%; background:var(--info); color:#fff; font-weight:700; font-size:16px;
    padding:14px 16px; border-radius:14px; border:0; border-bottom:4px solid var(--info-dark); text-align:center;
    box-shadow:0 10px 22px rgba(62,142,208,.24); cursor:pointer; font-family:inherit; }
  
  .choice-q { text-align:center; font-size:16px; font-weight:700; color:var(--gray-700); margin:4px 0 0; }
  .plans { display:flex; flex-direction:column; gap:26px; margin-top:28px; }
  .plan { position:relative; background:#fff; border:1.5px solid var(--gray-100); border-radius:16px;
    padding:26px 20px 20px; text-align:center; box-shadow:0 1px 2px rgba(15,23,42,.05); }
  .plan.hl { border-color:var(--mathyellow); box-shadow:0 0 0 1px rgba(236,200,98,.4),0 1px 2px rgba(15,23,42,.05); }
  .badge { position:absolute; top:-16px; left:50%; transform:translateX(-50%); min-width:160px;
    background:var(--mathyellow); color:var(--gray-950); font-size:14px; font-weight:700; padding:8px 20px; border-radius:8px; }
  .plan h2 { margin:0; font-size:24px; font-weight:700; }
  .plan .detail { margin:8px 0 0; min-height:40px; font-size:14px; color:var(--gray-500); }
  .plan .visual { margin:16px auto 4px; height:80px; display:flex; align-items:center; justify-content:center; }
  .plan .price { font-size:30px; font-weight:700; }
  .plan .price small { font-size:14px; font-weight:500; color:var(--gray-500); }
  .plan .incl { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:16px;
    font-size:14px; font-weight:700; color:var(--gray-500); }
  .plan .incl .chk { display:inline-flex; width:16px; height:16px; border-radius:999px; background:#ecfdf5;
    color:#059669; align-items:center; justify-content:center; font-size:10px; box-shadow:0 0 0 1px #d1fae5; }
  .plan .kies { display:block; margin-top:20px; width:100%; background:#fff; border:1px solid var(--gray-300);
    border-radius:10px; padding:13px 16px; font-size:14px; font-weight:700; color:var(--gray-950);
    box-shadow:0 2px 0 rgba(17,24,39,.12); }

</style></head><body>
<div class="mock-banner"><b>OEFENVERSIE</b> — dit is de iteratie-preview, er wordt niets opgeslagen of betaald</div>

<main>
  <p class="choice-q">Welk pakket past bij jou?</p>
  <div class="plans">
    <div class="plan hl"><span class="badge">Meest gekozen</span>
<h2>Jaarabonnement</h2><p class="detail">Jaarlijkse afschrijving na de proefweek</p><div class="visual"><svg viewBox="0 0 200 130" width="176" height="114" fill="none"><ellipse cx="82" cy="67" rx="78" ry="42" transform="rotate(-10 82 67)" stroke="#cbd5e1" stroke-dasharray="5 6" stroke-width="2"/><circle cx="82" cy="67" r="27" fill="#facc15" stroke="#111827" stroke-width="3"/><circle cx="158" cy="52" r="15" fill="#3b82f6" stroke="#111827" stroke-width="3"/><path d="M154 43c4-2 9-1 10 2 1 2-1 4-4 4-3-1-5 1-4 4 1 2-1 4-4 3-4-2-5-7-3-10 1-1 2-2 5-3Z" fill="#86efac"/></svg></div>
    <div class="plan">
<h2>Maandabonnement</h2><p class="detail">Maandelijkse afschrijving na de proefweek</p><div class="visual"><svg viewBox="0 0 200 130" width="176" height="114" fill="none"><ellipse cx="100" cy="66" rx="57" ry="37" transform="rotate(-18 100 66)" stroke="#cbd5e1" stroke-dasharray="5 6" stroke-width="2"/><circle cx="100" cy="66" r="24" fill="#3b82f6" stroke="#111827" stroke-width="3"/><path d="M95 47c7-4 16-2 18 4 1 4-3 6-8 6-5-1-8 2-6 6 2 4-2 8-8 6-6-4-8-11-5-16 2-3 5-4 9-6Z" fill="#86efac"/><circle cx="149" cy="39" r="13" fill="#cbd5e1" stroke="#111827" stroke-width="3"/></svg></div>
    <div class="plan">
<h2>De hele schooltijd</h2><p class="detail">Eenmalig betalen na de proefweek</p><div class="visual"><svg viewBox="0 0 200 130" width="176" height="114" fill="none"><ellipse cx="100" cy="65" rx="26" ry="17" fill="#facc15" stroke="#111827" stroke-width="3" transform="rotate(-8 100 65)"/><path d="M108 65.6 112.9 74.3 108 82.1 95.7 87.7 78.3 88.1 60.4 81.2 47.7 67.2 45.5 48.4 56.9 29" stroke="#bfdbfe" stroke-linecap="round" stroke-width="13" fill="none" opacity=".85"/><path d="M92 64.4 87.1 55.7 92 47.9 104.3 42.3 121.7 41.9 139.6 48.8 152.3 62.8 154.5 81.6 143.1 101" stroke="#fed7aa" stroke-linecap="round" stroke-width="13" fill="none" opacity=".85"/></svg></div>
  </div>
</main></body></html>
